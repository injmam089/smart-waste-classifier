    <path d="M 256 210 C 256 250 256 300 256 344" stroke="#166534" stroke-width="8" stroke-linecap="round"/>
    <path d="M 256 260 C 276 250 296 256 296 256" stroke="#166534" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 256 290 C 236 280 216 286 216 286" stroke="#166534" stroke-width="6" stroke-linecap="round" fill="none"/>
