    <path d="M 174 380 L 138 318 L 162 304 L 104 304 L 104 362 L 128 348 L 164 410 C 179 436 213 445 239 430 L 277 408 L 263 383 L 225 405 C 213 412 197 408 190 396 Z" fill="#ffffff" fill-opacity="0.95"/>

