    <path d="M 390 270 L 354 332 L 330 318 L 330 376 L 388 376 L 364 362 L 410 282 C 425 256 416 222 390 207 L 352 185 L 338 210 L 376 232 C 388 239 392 255 385 267 Z" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Bottom Left Arrow -->
